services:
  # ---------- MySQL 数据库 ----------
  db:
    image: mysql:8.0
    container_name: ticket-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: ticket_system
      MYSQL_USER: ticket
      MYSQL_PASSWORD: ticket123456
      TZ: Asia/Shanghai
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- FastAPI 后端 ----------
  backend:
    build: ./backend
    container_name: ticket-backend
    restart: unless-stopped
    environment:
      # 部署使用 MySQL，本地开发默认 SQLite
      DATABASE_URL: mysql+pymysql://ticket:ticket123456@db:3306/ticket_system?charset=utf8mb4
      JWT_SECRET: please-change-this-secret-in-production
      TZ: Asia/Shanghai
    volumes:
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # ---------- Nginx + Vue 前端 ----------
  frontend:
    build: ./frontend
    container_name: ticket-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  upload_data:
